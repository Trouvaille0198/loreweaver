set_keys: [dnd, dnd5e]
# Check resolution (M16): d20 + modifier vs DC. Natural-die crits read the kept
# face via dice[0]; `modifier` (ability + proficiency + situational) is folded
# into `roll` by the engine before the ladder runs. advantage/disadvantage are
# whole-roll overrides the KP tool / commands select by name.
resolution:
  version: 1
  roll: 1d20
  target: dc
  compare: ">="
  modifiers:
    advantage: {roll: 2d20kh1}
    disadvantage: {roll: 2d20kl1}
  # How the generic check tool/commands feed this system: favorable/unfavorable
  # counts route to these roll modifiers; a dc-target check without an explicit
  # DC uses default_target; the proficient flag adds the named canonical stat.
  check:
    favorable: advantage
    unfavorable: disadvantage
    default_target: 15
    proficiency: 熟练加值
    default_skill: 察觉
  ranks:
    - {id: crit, when: "dice[0] == 20", success: true, critical: true, tier: 3}
    - {id: fumble, when: "dice[0] == 1", fumble: true, tier: 0}
    - {id: success, when: "roll >= target", success: true, tier: 2}
    - {id: fail, tier: 1}
# Success-ladder presentation labels; see rulepacks/coc7.yaml for the shape.
labels:
  en:
    crit: [Critical Success, Natural 20]
    success: {display: Success, markers: []}
    fail: {display: Failure, markers: []}
    fumble: [Critical Failure, Natural 1]
  zh:
    crit: [大成功]
    success: {display: 成功, markers: []}
    fail: {display: 失败, markers: []}
    fumble: [大失败]
