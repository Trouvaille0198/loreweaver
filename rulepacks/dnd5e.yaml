# Race data (SRD 5.1): the only MECHANICAL facts are `bonuses`, applied to the
# sheet's base ability scores ONCE at character creation (so every derived stat —
# AC, HP, skills — recomputes through the normal lanes). `speed`/`darkvision`/
# `traits` are display facts resolved from the race name at read time; they are
# never stored on the sheet, so an edited race field never leaves stale text.
races:
  human:
    name: {en: Human, zh: 人类}
    aliases: [人类, 人類, human, humans]
    bonuses: {力量: 1, 敏捷: 1, 体质: 1, 智力: 1, 感知: 1, 魅力: 1}
    speed: 30
    darkvision: 0
    traits: {en: "Versatile +1 to all six ability scores; exceptional adaptability.", zh: "宽适应性：六项属性各+1；极强的适应力与野心。"}
  elf:
    name: {en: Elf, zh: 精灵}
    aliases: [精灵, 精靈, elf, elves]
    bonuses: {敏捷: 2}
    speed: 30
    darkvision: 60
    traits: {en: "Darkvision 60 ft; Keen Senses (Perception); Fey Ancestry (advantage vs charm, no magic sleep); Trance.", zh: "黑视60尺；敏锐感官（察觉熟练）；先祖传承（魅惑豁免优势、免疫魔法睡眠）；出神（4小时冥想代替睡眠）。"}
