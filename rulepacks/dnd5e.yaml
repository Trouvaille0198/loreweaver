    等级: level
    职业: character_class
    种族: race
  # Check-input bridge: rolling a check "on" the LEFT canonical feeds the
  # RIGHT canonical's value into the roll (an ability check uses its modifier).
  check_values:
    力量: 力量调整值
    敏捷: 敏捷调整值
    体质: 体质调整值
    智力: 智力调整值
